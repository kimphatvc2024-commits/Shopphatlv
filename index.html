<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHÁT LV — Shop Dịch Vụ & Acc FF</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #131722;
      --card-2: #191f2e;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #ff4655;
      --accent-2: #00d4ff;
      --border: rgba(255, 255, 255, 0.08);
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; }
    a { color: inherit; text-decoration: none; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(11, 13, 18, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.5px; }
    .brand span { color: var(--accent); }
    .wallet {
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 999px;
      font-size: 0.88rem; font-weight: 600;
    }
    .wallet b { color: var(--green); }

    .hero {
      padding: 28px 18px 18px;
      max-width: 1080px; margin: 0 auto;
    }
    .hero h1 { font-size: 1.65rem; font-weight: 800; margin-bottom: 6px; }
    .hero p { color: var(--muted); font-size: 0.95rem; }

    .tabs {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 12px 18px; max-width: 1080px; margin: 0 auto;
    }
    .tab {
      background: var(--card); color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 10px;
      font-size: 0.88rem; font-weight: 600; white-space: nowrap; cursor: pointer;
    }
    .tab.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      padding: 8px 18px 36px;
      max-width: 1080px; margin: 0 auto;
    }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    }
    .badge {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      padding: 3px 9px; border-radius: 999px;
      background: rgba(0, 212, 255, 0.14); color: var(--accent-2);
      margin-bottom: 8px;
    }
    .item h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .item p { color: var(--muted); font-size: 0.86rem; }
    .foot {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding-top: 10px; border-top: 1px solid var(--border);
    }
    .price { font-weight: 800; color: #fbbf24; font-size: 0.98rem; }
    .btn {
      background: var(--accent); color: #fff; border: none;
      padding: 8px 14px; border-radius: 9px;
      font-weight: 700; font-size: 0.86rem; cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .btn-sub {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
    }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; width: 100%; max-width: 380px;
    }
    .modal h3 { margin-bottom: 8px; }
    .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }
    .modal input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      margin-bottom: 12px;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    footer {
      text-align: center; color: var(--muted); font-size: 0.82rem;
      padding: 20px 16px 32px; border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">PHÁT <span>LV</span></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div class="wallet">Số dư: <b id="balanceText">0đ</b></div>
      <button class="btn btn-sub" onclick="openTopup()">+ Nạp</button>
    </div>
  </header>

  <section class="hero">
    <h1>PHÁT LV — Dịch Vụ & Acc Free Fire</h1>
    <p>Chọn danh mục bên dưới để xem gói dịch vụ, nạp số dư mẫu hoặc đặt mua nhanh.</p>
  </section>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">Tất cả</button>
    <button class="tab" data-cat="acc">Bán & Thuê Acc FF</button>
    <button class="tab" data-cat="menu">Menu ADR / Telekill VIP</button>
    <button class="tab" data-cat="file">File Android OB54</button>
    <button class="tab" data-cat="cert">Chứng Chỉ Unban & Proxy VPN</button>
  </div>

  <main class="grid" id="productGrid"></main>

  <div class="modal-bg" id="topupModal">
    <div class="modal">
      <h3>Nạp tiền (Bản giao diện mẫu)</h3>
      <p>Nhập số tiền muốn test số dư trên trình duyệt (chưa kết nối cổng thanh toán thật).</p>
      <input type="number" id="topupInput" placeholder="VD: 50000" min="1000" step="1000" />
      <div class="modal-actions">
        <button class="btn btn-sub" onclick="closeTopup()">Đóng</button>
        <button class="btn" onclick="confirmTopup()">Cộng số dư</button>
      </div>
    </div>
  </div>

  <footer>PHÁT LV • Bản giao diện chạy trên GitHub Pages</footer>

  <script>
    const products = [
      { id: 1, cat: "acc", badge: "Acc FF", name: "Acc FF VIP — Skin Súng & Thẻ", desc: "Thông tin rõ ràng, kiểm tra nick trước khi giao.", price: 180000 },
      { id: 2, cat: "acc", badge: "Thuê Acc", name: "Thuê Acc FF Theo Ngày", desc: "Phù hợp leo rank, trải nghiệm đồ họa & skin.", price: 35000 },
      { id: 3, cat: "menu", badge: "Menu VIP", name: "Menu ADR / Telekill VIP (OB54)", desc: "Cấu hình tối ưu, hỗ trợ cài đặt & hướng dẫn sử dụng.", price: 90000 },
      { id: 4, cat: "file", badge: "Android OB54", name: "File Android OB54 — Nhẹ Tâm & Aim Drag", desc: "Hỗ trợ mượt mà trên máy Android cấu hình thấp đến cao.", price: 50000 },
      { id: 5, cat: "cert", badge: "Chứng Chỉ & Proxy", name: "Chứng Chỉ Unban & Proxy VPN", desc: "Gói cấu hình kết nối & hỗ trợ kích hoạt nhanh.", price: 70000 }
    ];

    let balance = Number(localStorage.getItem("phatlv_bal") || 0);
    let currentCat = "all";

    const fmt = (n) => n.toLocaleString("vi-VN") + "đ";

    function renderBalance() {
      document.getElementById("balanceText").textContent = fmt(balance);
      localStorage.setItem("phatlv_bal", String(balance));
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const list = currentCat === "all" ? products : products.filter(p => p.cat === currentCat);
      grid.innerHTML = list.map(p => `
        <div class="item">
          <div>
            <span class="badge">${p.badge}</span>
            <h3>${p.name}</h3>
            <p>${p.desc}</p>
          </div>
          <div class="foot">
            <span class="price">${fmt(p.price)}</span>
            <button class="btn" onclick="buyItem(${p.id})">Mua ngay</button>
          </div>
        </div>
      `).join("");
    }

    function buyItem(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;
      if (balance < item.price) {
        alert("Số dư chưa đủ! Bấm nút '+ Nạp' ở góc trên để nạp thử số dư.");
        return;
      }
      balance -= item.price;
      renderBalance();
      alert("Đã đặt mua mẫu: " + item.name + " (" + fmt(item.price) + ")");
    }

    function openTopup() {
      document.getElementById("topupModal").classList.add("open");
      document.getElementById("topupInput").focus();
    }

    function closeTopup() {
      document.getElementById("topupModal").classList.remove("open");
    }

    function confirmTopup() {
      const val = Number(document.getElementById("topupInput").value);
      if (!val || val <= 0) {
        alert("Nhập số tiền lớn hơn 0 nhé.");
        return;
      }
      balance += val;
      renderBalance();
      document.getElementById("topupInput").value = "";
      closeTopup();
    }

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        currentCat = btn.dataset.cat;
        renderProducts();
      });
    });

    renderBalance();
    renderProducts();
  </script>
</body>
  </html>
